[project]
name = "sourcelume-python-plugin"
version = "0.0.1"
description = "Python plugin for Apache Sourcelume Tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Apache Software Foundation", email = "dev@apache.org" }
]
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.24.0",
  "typer>=0.9.0",
  "tomlkit>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "respx>=0.20.0",
]

[project.scripts]
sourcelume = "sourcelume.cli:app"

[tool.uv]
package = true
