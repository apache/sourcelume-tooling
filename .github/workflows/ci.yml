name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-plugin:
    name: Maven plugin (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

  python-plugin:
    name: Python plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sourcelume-python-plugin
    steps:
      - uses: actions/checkout@v4

      # pipx is preinstalled on GitHub-hosted runners; installing uv this
      # way avoids adding a third-party action to the ASF allowlist.
      - name: Install uv
        run: pipx install uv

      - name: Run tests
        run: uv run --locked --extra dev pytest

  cmake-module:
    name: CMake module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sourcelume-cmake-module
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_TESTING=ON

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
